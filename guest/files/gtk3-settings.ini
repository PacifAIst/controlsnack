# ControlSnack: GTK 3 defaults for every application in the session. A cursor that blinks and widgets that fade
# keep the screen changing, and the agent waits for a quiet screen (wait_for screen_idle). The XFCE settings daemon
# publishes its own cursor setting over this one; provision.sh changes that one in the same way.
[Settings]
gtk-cursor-blink=false
gtk-enable-animations=false

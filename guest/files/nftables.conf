#!/usr/sbin/nft -f
# ControlSnack, defence in depth: the guest has no network device at run time, and with --allow-net traffic leaves
# only through the agent's proxy on loopback. If someone ever gives the VM a NIC, nothing but loopback works.
flush ruleset

table inet controlsnack {
    chain input {
        type filter hook input priority 0; policy drop;
        iifname "lo" accept
        ct state established,related accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy drop;
        oifname "lo" accept
        ct state established,related accept
    }
}

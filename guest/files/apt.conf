// ControlSnack: a small image, and a build that never stops to ask a question.
APT::Install-Recommends "false";
APT::Install-Suggests "false";
Acquire::Languages "none";
Acquire::Retries "5";

// Files this recipe writes before the packages arrive (nftables.conf, the power manager settings) are also files
// those packages ship. Without these options dpkg stops to ask which to keep; with no terminal that is an error, and
// the build fails after the packages were all unpacked. Keep ours.
Dpkg::Options {
    "--force-confdef";
    "--force-confold";
};

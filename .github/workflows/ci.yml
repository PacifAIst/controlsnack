name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Run the end-to-end tests on Ubuntu with KVM"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: "true"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        env:
          GOTOOLCHAIN: local
      # The quality gate: gofmt, mod tidy, vet, lint, tests (-race where a C toolchain exists, which is always
      # the case on the Linux and macOS runners), govulncheck, license policy, cross-build smoke, repo checks.
      - name: go run ./tools/dev check
        run: go run ./tools/dev check
      # `doctor` must run on every host OS and always print a verdict (PLAN.md section 13.5). The macOS and Windows
      # runners get a QEMU first so the command can exit 0; what it reports there (WHPX, HVF, tcg) is the first
      # real-hardware evidence for those accelerators, so the JSON is kept as an artifact.
      # A package feed that times out must not leave the step green with no QEMU installed (Chocolatey answered 504 once and the step
      # went on): try again, and stop with a message if QEMU is still not there.
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for i in 1 2 3 4; do
            brew install qemu && command -v qemu-system-x86_64 && break
            echo "QEMU is not installed after attempt $i; trying again in 30 s"; sleep 30
          done
          command -v qemu-system-x86_64 || { echo "QEMU could not be installed"; exit 1; }
      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = 'C:\Program Files\qemu\qemu-system-x86_64.exe'
          for ($i = 1; $i -le 4 -and -not (Test-Path $exe); $i++) {
            choco install qemu --no-progress -y
            if (-not (Test-Path $exe)) { Write-Host "QEMU is not installed after attempt $i; trying again in 30 s"; Start-Sleep -Seconds 30 }
          }
          if (-not (Test-Path $exe)) { throw 'QEMU could not be installed' }
      - name: controlsnack doctor --json
        if: runner.os != 'Linux'
        shell: bash
        run: |
          go run ./cmd/controlsnack doctor --json | tee doctor-${{ runner.os }}.json
      - name: Keep the doctor report
        if: runner.os != 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: doctor-${{ runner.os }}
          path: doctor-${{ runner.os }}.json
          if-no-files-found: ignore

  ubuntu-extras:
    name: ubuntu extras
    runs-on: ubuntu-latest
    # No `needs: check`: nothing here depends on the checks, and waiting for them hid this job's own problems for three runs.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-build all release targets
        run: go run ./tools/dev cross -o dist/cross
      # The release archives are what a person downloads: build them, check their checksums and run the Linux one.
      - name: Release archives and smoke test
        run: |
          go run ./tools/dev release -o dist/release
          (cd dist/release && sha256sum -c SHA256SUMS)
          tar -xzf dist/release/controlsnack_*_linux_amd64.tar.gz -C dist/release
          dist/release/controlsnack_*_linux_amd64/controlsnack --version
          dist/release/controlsnack_*_linux_amd64/controlsnack version
      - name: Fuzz smoke (30 s per target)
        run: go run ./tools/dev fuzz -time 30s
      - name: Guest agent integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb at-spi2-core tesseract-ocr libwebp7
          # -noreset: Xvfb resets itself when its last client goes, and the next test's connection is then refused.
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" go test -tags integration -count=1 ./internal/agent/...
        # Chromium for CDP comes from the runner's preinstalled Google Chrome.

  e2e:
    name: e2e (Ubuntu + KVM)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check for KVM
        run: |
          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "no /dev/kvm: the e2e run will use TCG"; fi
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: Cache the base image
        uses: actions/cache@v6
        with:
          path: ~/.cache/controlsnack/images
          key: base-image-${{ hashFiles('guest/**') }}
      - name: go run ./tools/dev e2e
        run: go run ./tools/dev e2e
